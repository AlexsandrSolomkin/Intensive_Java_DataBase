spring:
  application:
    name: user-service

  cloud:
    config:
      uri: http://config-server:8888

  datasource:
    url: jdbc:postgresql://postgres:5432/users_db
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

